spring.application.name=PC-Parts-Inventory
spring.datasource.url=jdbc:postgresql://localhost:5432/pc_parts_inventory
#spring.datasource.url=jdbc:H2://localhost:8080/pc_parts_inventory
spring.datasource.username=pcparts_user
spring.datasource.password=${DB_PASSWORD}
# Flyway manages database migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
# Hibernate only validates the schema
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false