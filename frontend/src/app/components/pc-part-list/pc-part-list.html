<div class="list-container">
  <h1>PC Parts List</h1>

  <div class="search-container">

    <div class="filter-group">
      <label for="category">Category</label>

      <div class="filter-controls">
        <select
          [(ngModel)]="categorySearch"
          id="category"
        >
          <option value="">All Categories</option>
          <option value="CPU">CPU</option>
          <option value="GPU">GPU</option>
          <option value="RAM">RAM</option>
          <option value="MOTHERBOARD">MOTHERBOARD</option>
          <option value="COOLER">COOLER</option>
          <option value="CASE">CASE</option>
          <option value="FANS">FANS</option>
          <option value="PSU">PSU</option>
        </select>

        <button
          (click)="searchByCategory()"
          class="filter-button"
          type="button"
        >
          Filter
        </button>
      </div>
    </div>


    <div class="filter-group">
      <label for="manufacturer-search">Manufacturer</label>

      <div class="filter-controls">
        <input
          [(ngModel)]="manufacturerSearch"
          id="manufacturer-search"
          placeholder="e.g. AMD"
          type="text"
        />

        <button
          (click)="searchByManufacturer()"
          class="filter-button"
          type="button"
        >
          Search
        </button>
      </div>
    </div>


    <div class="filter-group">
      <label for="low-stock-threshold">Low Stock</label>

      <div class="filter-controls">
        <input
          [(ngModel)]="lowStockThreshold"
          id="low-stock-threshold"
          min="0"
          placeholder="Threshold"
          type="number"
        />

        <button
          (click)="searchLowStock()"
          class="filter-button"
          type="button"
        >
          Show
        </button>
      </div>
    </div>

  </div>


  <table class="modern-table">
    <thead>
    <tr class="header-row">
      <th class="header-cell">Name</th>
      <th class="header-cell">Category</th>
      <th class="header-cell">Manufacturer</th>
      <th class="header-cell">Price</th>
      <th class="header-cell">Quantity</th>
      <th class="header-cell">Actions</th>
    </tr>
    </thead>

    <tbody>
    @for (part of pcParts(); track part.id) {
    <tr class="data-row">

      @if (editingPart?.id === part.id) {

      <td class="data-cell">
        <input
          [(ngModel)]="editingPart!.name"
          name="edit-name"
          type="text"
        />
      </td>

      <td class="data-cell">
        <select
          [(ngModel)]="editingPart!.category"
          name="edit-category"
        >
          <option value="CPU">CPU</option>
          <option value="GPU">GPU</option>
          <option value="RAM">RAM</option>
          <option value="MOTHERBOARD">MOTHERBOARD</option>
          <option value="COOLER">COOLER</option>
          <option value="CASE">CASE</option>
          <option value="FANS">FANS</option>
          <option value="PSU">PSU</option>
        </select>
      </td>

      <td class="data-cell">
        <input
          [(ngModel)]="editingPart!.manufacturer"
          name="edit-manufacturer"
          type="text"
        />
      </td>

      <td class="data-cell">
        <input
          [(ngModel)]="editingPart!.price"
          name="edit-price"
          type="number"
        />
      </td>

      <td class="data-cell">
        <input
          [(ngModel)]="editingPart!.quantity"
          name="edit-quantity"
          type="number"
        />
      </td>

      <td class="data-cell actions-cell">
        <button
          (click)="saveEditing()"
          class="action-button edit-button"
        >
          Save
        </button>

        <button
          (click)="cancelEditing()"
          class="action-button cancel-button"
        >
          Cancel
        </button>
      </td>

      } @else {

      <td class="data-cell">{{ part.name }}</td>
      <td class="data-cell">{{ part.category }}</td>
      <td class="data-cell">{{ part.manufacturer }}</td>
      <td class="data-cell price-cell">${{ part.price }}</td>
      <td class="data-cell quantity-cell">{{ part.quantity }}</td>

      <td class="data-cell actions-cell">
        <button
          (click)="startEditing(part)"
          class="action-button edit-button"
        >
          Edit
        </button>

        <button
          (click)="startRestocking(part)"
          class="action-button restock-button"
        >
          Restock
        </button>

        <button
          (click)="deletePcPart(part.id)"
          class="action-button delete-button"
        >
          Delete
        </button>

        @if (restockPartId === part.id) {

        <input
          [(ngModel)]="restockQuantity"
          class="restock-input"
          placeholder="Quantity"
          type="number"
        />

        <button
          (click)="confirmRestock()"
          class="action-button confirm-button"
        >
          Confirm
        </button>

        <button
          (click)="cancelRestock()"
          class="action-button cancel-button"
        >
          Cancel
        </button>

        }
      </td>

      }

    </tr>
    }
    </tbody>
  </table>
</div>
