<label for="category">Category:</label>

<select
  id="category"
  [(ngModel)]="categorySearch"
>
  <option value="">All Categories</option>
  <option value="CPU">CPU</option>
  <option value="GPU">GPU</option>
  <option value="RAM">RAM</option>
  <option value="MOTHERBOARD">Motherboard</option>
  <option value="COOLER">Cooler</option>
  <option value="CASE">Case</option>
  <option value="FANS">Fans</option>
  <option value="PSU">PSU</option>
</select>

<button (click)="searchByCategory()">
  Filter
</button>


<input
type="text"
[(ngModel)]="manufacturerSearch"
placeholder="Search by manufacturer"
/>
<button (click)="searchByManufacturer()">
  Search
</button>


<input
  type="text"
  [(ngModel)]="lowStockThreshold"
  placeholder="Low stock threshold"
/>
<button (click)="searchLowStock()">
  Low Stock
</button>

<table>
  <thead>
    <tr>
      <th>Name</th>
      <th>Category</th>
      <th>Manufacturer</th>
      <th>Price</th>
      <th>Quantity</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    @for (part of pcParts(); track part.id){
      <tr>

        @if (editingPart?.id === part.id) {
        <td>
          <input
            type="text"
            [(ngModel)]="editingPart!.name"
            name="edit-name"
          />
        </td>

        <td>
          <input
            type="text"
            [(ngModel)]="editingPart!.category"
            name="edit-category"
          />
        </td>

        <td>
          <input
            type="text"
            [(ngModel)]="editingPart!.manufacturer"
            name="edit-manufacturer"
          />
        </td>

        <td>
          <input
            type="number"
            [(ngModel)]="editingPart!.price"
            name="edit-price"
          />
        </td>

        <td>
          <input
            type="number"
            [(ngModel)]="editingPart!.quantity"
            name="edit-quantity"
          />
        </td>


        <td>
          <button (click)="saveEditing()">Save</button>
          <button (click)="cancelEditing()">Cancel</button>
        </td>
        } @else{
            <td>{{ part.name }}</td>
            <td>{{ part.category }}</td>
            <td>{{ part.manufacturer }}</td>
            <td>${{ part.price }}</td>
            <td>{{ part.quantity }}</td>
            <td>
              <button (click)="startEditing(part)">Edit</button>
              <button (click)="deletePcPart(part.id)">Delete</button>
            </td>

          }
      </tr>

    }
  </tbody>
</table>
