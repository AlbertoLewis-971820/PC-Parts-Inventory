name: AWS OIDC Test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test-aws-auth:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::605134438691:role/PCPartVaultGitHubDeployRole
          aws-region: us-east-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Send test command to EC2
        id: ssm
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-024a9153ae698d8d4" \
            --document-name "AWS-RunShellScript" \
            --comment "GitHub Actions SSM connectivity test" \
            --parameters 'commands=["--parameters 'commands=["sudo -u ubuntu bash -lc 
          '\''cd /home/ubuntu/pc-parts-inventory && 
          docker compose ps'\''"]'"]' \
            --query "Command.CommandId" \
            --output text)
          
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "SSM Command ID: $COMMAND_ID"

      - name: Get test command result
        run: |
          sleep 5
          
          aws ssm get-command-invocation \
            --command-id "${{ steps.ssm.outputs.command_id }}" \
            --instance-id "i-024a9153ae698d8d4" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'