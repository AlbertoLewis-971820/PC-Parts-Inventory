name: AWS OIDC Test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  inspect-oidc:
    runs-on: ubuntu-latest

    steps:
      - name: Inspect GitHub OIDC claims
        shell: bash
        run: |
          TOKEN_RESPONSE=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          TOKEN=$(echo "$TOKEN_RESPONSE" | jq -r '.value')

          echo "$TOKEN" \
            | cut -d '.' -f2 \
            | base64 --decode 2>/dev/null \
            | jq '{
                aud,
                sub,
                repository,
                repository_id,
                repository_owner,
                repository_owner_id,
                ref
              }'