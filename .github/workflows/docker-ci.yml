name: Docker CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-docker-image:
    name: Build Docker Image
    runs-on: ubuntu-latest


    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set lowercase repository owner
        run: echo "GHCR_OWNER=${OWNER,,}" >> "$GITHUB_ENV"
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Log into Github Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify repository owner
        run: |
          echo "GHCR owner: $GHCR_OWNER"
          docker compose config --images

      - name: Build Docker image
        run: docker compose build


      - name: Push Docker Images
        if: github.event_name == 'push'
        run: docker compose push


  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest

    needs: build-docker-image

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::605134438691:role/PCPartVaultGitHubDeployRole
          aws-region: us-east-1

      - name: Deploy to EC2
        id: deploy
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-024a9153ae698d8d4" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy PC Part Vault from GitHub Actions" \
            --parameters 'commands=["sudo -u ubuntu bash -lc '\''cd /home/ubuntu/pc-parts-inventory && docker compose pull && docker compose up -d'\''"]' \
            --query "Command.CommandId" \
            --output text)
          
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "Deployment command ID: $COMMAND_ID"

      - name: Wait for deployment
        run: |
          COMMAND_ID="${{ steps.deploy.outputs.command_id }}"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "i-024a9153ae698d8d4"

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-024a9153ae698d8d4" \
            --query "Status" \
            --output text)

          echo "Deployment status: $STATUS"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-024a9153ae698d8d4" \
            --query '{Output:StandardOutputContent,Error:StandardErrorContent}'

          if [ "$STATUS" != "Success" ]; then
            echo "Production deployment failed."
            exit 1
          fi

          echo "Production deployment succeeded."


